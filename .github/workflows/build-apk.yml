name: Build Android APK & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Build web directory for Capacitor
        run: npm run build

      - name: Add Android platform and Sync
        run: |
          npx cap add android
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          npx cap sync android
        env:
          CI: true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias onpoint \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kumon2026 \
            -keypass kumon2026 \
            -dname "CN=Kumon Onpoint, OU=Educacao, O=Kumon, L=Sao Paulo, ST=SP, C=BR"
          echo "✅ Keystore de release gerada com sucesso!"

      - name: Inject Signing Config in build.gradle
        run: |
          node -e "
            const fs = require('fs');
            const gradlePath = 'android/app/build.gradle';
            let content = fs.readFileSync(gradlePath, 'utf8');

            const signingBlock = \`
                release {
                    storeFile file('release.keystore')
                    storePassword 'kumon2026'
                    keyAlias 'onpoint'
                    keyPassword 'kumon2026'
                }
            \`;

            // Insere o signingConfig release
            content = content.replace(/signingConfigs\s*\{/, 'signingConfigs {' + signingBlock);

            // Vincula o signingConfig ao buildTypes.release
            content = content.replace(/buildTypes\s*\{\s*release\s*\{/, 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n');

            fs.writeFileSync(gradlePath, content, 'utf8');
            console.log('✅ Assinatura automática injetada no Gradle!');
          "

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Locate and Rename APK
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Tentando assembleDebug como fallback..."
            cd android && ./gradlew assembleDebug --no-daemon && cd ..
            APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          cp "$APK_PATH" output-apk/kumon-onpoint.apk
          echo "✅ APK preparado em output-apk/kumon-onpoint.apk"
          ls -lh output-apk/kumon-onpoint.apk

      - name: Read app version
        id: read_version
        run: |
          BASE_VERSION=$(node -e "try { const v=require('./version.json'); console.log(v.version || '1.0.0'); } catch(e) { console.log('1.0.0'); }")
          BUILD_NUM=${{ github.run_number }}
          VERSION="${BASE_VERSION}.${BUILD_NUM}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Versão Gerada: $VERSION | Tag: $TAG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumon-onpoint-apk
          path: output-apk/kumon-onpoint.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.read_version.outputs.tag }}
          name: "Kumon Onpoint ${{ steps.read_version.outputs.tag }}"
          body: |
            ## 📱 Novo APK do Kumon Onpoint Disponível!

            **Versão:** `${{ steps.read_version.outputs.version }}`
            **Build:** #${{ github.run_number }}
            **Data:** $(date '+%d/%m/%Y %H:%M')
            **Commit:** `${{ github.sha }}`

            ### 📲 Como Instalar no Celular Android:
            1. Baixe o arquivo **`kumon-onpoint.apk`** logo abaixo (em *Assets*);
            2. Toque no arquivo baixado no seu celular;
            3. Se o Android pedir, marque a opção *"Permitir desta fonte"*;
            4. Clique em **Instalar** e aproveite! 🎉

            ---
            *Compilação automática gerada via Capacitor & GitHub Actions.*
          files: output-apk/kumon-onpoint.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
